<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// =====================================================================================================
// Sungrow laadinfra — IDC80E (alles-in-één DC-lader 80 kW op voet) en CDC1000E ChargeStack (power cabinet 2 × 500 kW + dispensers)
// bron: Sungrow productsheets (v2/v3 2026) en installatiehandleidingen; eenheid 1 = 1 m
// =====================================================================================================
const Q = new URLSearchParams(location.search), PROD = 'idc';
const N = Math.max(1, Math.min(PROD === 'cdc' ? 6 : 4, parseInt(Q.get('n')) || (PROD === 'cdc' ? 4 : 2)));
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const renderer = new THREE.WebGLRenderer({antialias: true}); renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.shadowMap.enabled = true; renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xdfe6e8); scene.fog = new THREE.Fog(0xdfe6e8, 60, 140);
const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 400);
const ctl = new THREE.OrbitControls(camera, renderer.domElement); ctl.enableDamping = true; ctl.maxPolarAngle = Math.PI*0.495;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a9188, 0.75));
const zon = new THREE.DirectionalLight(0xffffff, 0.85); zon.position.set(-14, 22, 12); zon.castShadow = true; zon.shadow.mapSize.set(2048, 2048); Object.assign(zon.shadow.camera, {left: -20, right: 20, top: 20, bottom: -20}); scene.add(zon);
const M = (c, o) => new THREE.MeshStandardMaterial(Object.assign({color: c, roughness: 0.55, metalness: 0.1}, o || {}));
const LABELS = [], MAAT = [], ZONE = [], KABEL = [], DEUREN = [], AUTOS = [], GRONDM = [], KLIK = [];
function schil(p, w, h, d, m, x, y, z){ const t = 0.015; box(p, w, h, t, m, x, y, z - d/2 + t/2); box(p, t, h, d, m, x - w/2 + t/2, y, z); box(p, t, h, d, m, x + w/2 - t/2, y, z); box(p, w, t, d, m, x, y + h/2 - t/2, z); box(p, w, t, d, m, x, y - h/2 + t/2, z); }   // open kast (voorzijde = deur)
function box(p, w, h, d, m, x, y, z, sch){ const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y, z); if(sch !== false){ o.castShadow = true; o.receiveShadow = true; } p.add(o); return o; }
function cyl(p, r, h, m, x, y, z, as, seg){ const o = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg || 16), m); o.position.set(x, y, z); if(as === 'x') o.rotation.z = Math.PI/2; if(as === 'z') o.rotation.x = Math.PI/2; o.castShadow = true; p.add(o); return o; }
function ctex(w, h, f){ const c = document.createElement('canvas'); c.width = w; c.height = h; f(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; return t; }
function plak(p, w, h, t, x, y, z, ry){ const o = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({map: t, roughness: 0.5, transparent: true})); o.position.set(x, y, z); o.rotation.y = ry || 0; p.add(o); return o; }
function sprite(txt, pos, s, kleur, lijst){ const c = document.createElement('canvas'), g = c.getContext('2d'); g.font = 'bold 40px system-ui, Arial'; const tw = Math.ceil(g.measureText(txt).width + 40), W = Math.max(256, tw + 20);
  c.width = W; c.height = 96; const k = c.getContext('2d'); k.font = 'bold 40px system-ui, Arial'; k.fillStyle = 'rgba(255,255,255,.94)'; k.beginPath(); k.roundRect ? k.roundRect((W - tw)/2, 10, tw, 76, 14) : k.rect((W - tw)/2, 10, tw, 76); k.fill(); k.lineWidth = 4; k.strokeStyle = kleur || '#1b4f8a'; k.stroke();
  k.fillStyle = '#1d2b33'; k.textAlign = 'center'; k.fillText(txt, W/2, 62); const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map: t, depthTest: false, transparent: true})); sp.scale.set(0.9*(s || 1)*W/96, 0.9*(s || 1), 1); sp.position.copy(pos); sp.renderOrder = 10; scene.add(sp); (lijst || LABELS).push(sp); return sp; }
function kabel(p, pts, r, m){ const c = new THREE.CatmullRomCurve3(pts, false, 'centripetal', 0.2); const o = new THREE.Mesh(new THREE.TubeGeometry(c, pts.length*20, r, 8, false), m); o.castShadow = true; p.add(o); return o; }
const lbl = (txt, w, h, bg, fg, font) => ctex(w, h, (g, W, H) => { g.fillStyle = bg; g.fillRect(0, 0, W, H); g.fillStyle = fg; g.font = font || 'bold 28px Arial'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(txt, W/2, H/2 + 1); });

// ---------- materialen ----------
const wit = M(0xf1f2f0, {roughness: 0.4}), grijs = M(0xb9bec2, {roughness: 0.45, metalness: 0.3}), donker = M(0x2d3237, {roughness: 0.5}), zwart = M(0x16181b, {roughness: 0.6}),
  beton = M(0xb5b3ad, {roughness: 0.95}), oranje = M(0xf08c1e, {roughness: 0.45}), glas = M(0x1a2733, {roughness: 0.15, metalness: 0.3}), kabelM = M(0x1d1e20, {roughness: 0.6});
const asfalt = M(0x5c6064, {roughness: 0.95}), gras = M(0x7c9a5a, {roughness: 1}); GRONDM.push(gras, asfalt);
{ const g = box(scene, 120, 0.1, 120, gras, 0, -0.05, 0, false); g.receiveShadow = true; }

// ---------- bouwstenen ----------
// =====================================================================================================
// gedetailleerde assets (naar productfoto's, maatschetsen fig. 2-4/2-5 IDC80E en quick guide CDC1000E)
// =====================================================================================================
const alu = M(0xe3e6e8, {roughness: 0.32, metalness: 0.55}), aluD = M(0xc9ced2, {roughness: 0.35, metalness: 0.6}), antr = M(0x4a4f55, {roughness: 0.5, metalness: 0.35}),
  rvs = M(0xcfd3d6, {roughness: 0.22, metalness: 0.9}), koper = M(0xd99a6c, {roughness: 0.3, metalness: 0.85}), tin = M(0xd6d9db, {roughness: 0.25, metalness: 0.95}),
  pcb = M(0x2f7d46, {roughness: 0.6}), rubber = M(0x1b1c1e, {roughness: 0.85}), blauwLed = new THREE.MeshStandardMaterial({color: 0x29a8ff, emissive: 0x1a8cff, emissiveIntensity: 0.9, roughness: 0.3}),
  geel = M(0xf2c400, {roughness: 0.4}), rood = M(0xd32222, {roughness: 0.35}), zink = M(0xb7bcc0, {roughness: 0.38, metalness: 0.85}), plint = M(0x3b4045, {roughness: 0.6});
const ader = {L1: M(0x7a4a22), L2: M(0x1c1c1c), L3: M(0x8e9397), N: M(0x1f5fbf), PE: M(0x3fa34d)};
// afgeronde kast (bevel) — w × h × d, hoekstraal r
function rbox(p, w, h, d, r, m, x, y, z){ const s = new THREE.Shape(), a = w/2 - r, b = h/2 - r;
  s.moveTo(-a, -h/2); s.lineTo(a, -h/2); s.quadraticCurveTo(w/2, -h/2, w/2, -b); s.lineTo(w/2, b); s.quadraticCurveTo(w/2, h/2, a, h/2); s.lineTo(-a, h/2); s.quadraticCurveTo(-w/2, h/2, -w/2, b); s.lineTo(-w/2, -b); s.quadraticCurveTo(-w/2, -h/2, -a, -h/2);
  const g = new THREE.ExtrudeGeometry(s, {depth: d - 0.01, bevelEnabled: true, bevelThickness: 0.005, bevelSize: 0.005, bevelSegments: 2, curveSegments: 6}); g.translate(0, 0, -(d - 0.01)/2);
  const o = new THREE.Mesh(g, m); o.position.set(x, y, z); o.castShadow = true; o.receiveShadow = true; p.add(o); return o; }
// geperforeerd rooster (hexagonaal) als textuur
const perfo = (w, h, bg, gat, n) => ctex(w, h, (g, W, H) => { g.fillStyle = bg; g.fillRect(0, 0, W, H); g.fillStyle = gat; const s = n || 9;
  for(let y = s/2, r = 0; y < H; y += s*0.87, r++) for(let x = (r % 2 ? s/2 : 0) + s/2; x < W; x += s){ g.beginPath(); for(let k = 0; k < 6; k++){ const a = k*Math.PI/3 + Math.PI/6; g.lineTo(x + Math.cos(a)*s*0.36, y + Math.sin(a)*s*0.36); } g.fill(); } });
// laadscherm (UI)
const scherm = (w, h) => ctex(w, h, (g, W, H) => { const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#0d2e4f'); gr.addColorStop(1, '#0a1c30'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  g.fillStyle = '#e8f1fb'; g.font = `bold ${H*0.09}px Arial`; g.fillText('SUNGROW', W*0.05, H*0.13); g.font = `${H*0.07}px Arial`; g.fillStyle = '#9fc4e8'; g.fillText('12:30', W*0.82, H*0.13);
  g.fillStyle = '#e8f1fb'; g.font = `bold ${H*0.1}px Arial`; g.textAlign = 'center'; g.fillText('Welcome · plug in to charge', W/2, H*0.34); g.textAlign = 'left';
  for(let k = 0; k < 3; k++){ const x = W*0.12 + k*W*0.27; g.fillStyle = '#123f6b'; g.fillRect(x, H*0.45, W*0.22, H*0.38); g.strokeStyle = '#2b8be0'; g.lineWidth = 2; g.strokeRect(x, H*0.45, W*0.22, H*0.38);
    g.fillStyle = '#6fc0ff'; g.font = `${H*0.07}px Arial`; g.textAlign = 'center'; g.fillText(['RFID', 'QR', 'Auto'][k], x + W*0.11, H*0.75); g.fillRect(x + W*0.08, H*0.52, W*0.06, H*0.1); g.textAlign = 'left'; } });
// CCS2-stekker (handgreep + kop met DC-pinnen), opgebouwd in lokale coördinaten: kop wijst naar −y (in holster)
function ccs2(p, x, y, z, rx){ const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.x = rx || 0; p.add(g);
  box(g, 0.075, 0.2, 0.065, M(0x202225, {roughness: 0.45}), 0, 0.06, 0); rbox(g, 0.085, 0.07, 0.075, 0.02, M(0x2a2c2f), 0, 0.17, 0);          // handgreep + achterkap
  box(g, 0.05, 0.05, 0.012, M(0x3a3d41), 0, 0.12, 0.038); box(g, 0.02, 0.012, 0.012, M(0x29a8ff), 0, 0.1, 0.041);                             // ontgrendelknop
  const kop = cyl(g, 0.045, 0.07, M(0x26282b), 0, -0.07, 0, null, 24); cyl(g, 0.034, 0.03, M(0x1a1b1d), 0, -0.012, 0.004, null, 20);         // CCS-kop (AC-deel + DC)
  cyl(g, 0.03, 0.03, M(0x26282b), 0, -0.12, 0.0, null, 20); for(const s of [-1, 1]) cyl(g, 0.009, 0.032, tin, s*0.014, -0.125, 0, null, 10);  // DC+ / DC− pinnen
  cyl(g, 0.017, 0.12, rubber, 0, 0.22, -0.01, null, 12);                                                                                        // kabeltrekontlasting
  return g; }
// holster (laadpistool-houder) met blauwe statusring
function holster(p, x, y, z){ rbox(p, 0.12, 0.15, 0.05, 0.018, M(0x16181b), x, y, z); rbox(p, 0.135, 0.165, 0.03, 0.022, blauwLed, x, y, z - 0.012); box(p, 0.085, 0.11, 0.02, M(0x08090a), x, y, z + 0.022); }
// gegolfde beschermslang (cable management) langs een curve
function slang(p, pts, r, m){ const c = new THREE.CatmullRomCurve3(pts); const o = new THREE.Mesh(new THREE.TubeGeometry(c, pts.length*24, r, 10, false), m); o.castShadow = true; p.add(o);
  const L = c.getLength(), n = Math.floor(L/0.03); for(let k = 0; k < n; k++){ const t = k/n, q = c.getPointAt(t), tg = c.getTangentAt(t); const ring = new THREE.Mesh(new THREE.TorusGeometry(r*1.02, r*0.12, 4, 12), m); ring.position.copy(q); ring.lookAt(q.clone().add(tg)); p.add(ring); } return c; }
// veer (spiraal) rond een kort stuk curve
function veer(p, c, t0, t1, r, m){ const pts = [], n = 160, w = 26; for(let k = 0; k <= n; k++){ const t = t0 + (t1 - t0)*k/n, q = c.getPointAt(t), tg = c.getTangentAt(t), a = V(0, 1, 0).cross(tg).normalize(), b = tg.clone().cross(a).normalize(), f = k/n*w*Math.PI*2;
    pts.push(q.clone().addScaledVector(a, Math.cos(f)*r).addScaledVector(b, Math.sin(f)*r)); } kabel(p, pts, 0.0035, m); }
// DIN-railcomponenten
function din(p, x, y, z, n, w, kleur, hendel){ for(let k = 0; k < n; k++){ const xx = x + k*w; box(p, w*0.96, 0.09, 0.07, M(kleur || 0xeceeee), xx, y, z); box(p, w*0.5, 0.02, 0.02, M(hendel || 0x2b2d30), xx, y + 0.012, z + 0.04); } }
function pcbBord(p, x, y, z, w, h){ box(p, w, h, 0.004, pcb, x, y, z); for(let k = 0; k < 10; k++) box(p, 0.02 + (k % 3)*0.01, 0.015, 0.012, M([0x111, 0x222, 0x333, 0xb0b0b0][k % 4]), x - w/2 + 0.03 + (k % 5)*w*0.19, y - h/2 + 0.04 + Math.floor(k/5)*h*0.45, z + 0.007);
  box(p, 0.04, 0.04, 0.01, M(0x101010), x, y, z + 0.006); cyl(p, 0.008, 0.02, M(0x1b4f8a), x + w*0.3, y + h*0.3, z + 0.012, 'z', 10); }

// ---------- IDC80E: kast 660 × 1050 × 390 op voet (1780 h, met kabelbeugels 2032); fundering 840 × 726, 200 boven maaiveld ----------
function idc80(x, z, nr){ const G = new THREE.Group(); G.position.set(x, 0, z); scene.add(G);
  box(G, 0.84, 0.2, 0.726, beton, 0, 0.1, 0); for(const [a, b] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) cyl(G, 0.012, 0.03, rvs, a*0.2, 0.215, -0.03 + b*0.09);   // fundering + keilbouten M12
  const y0 = 0.2;
  // voet (post): brede voetplaat, kolom, dwarsdrager onder de kast (antraciet, foto)
  box(G, 0.54, 0.02, 0.4, antr, 0, y0 + 0.01, -0.03); box(G, 0.44, 0.62, 0.3, antr, 0, y0 + 0.33, -0.03);
  box(G, 0.42, 0.6, 0.005, M(0x3d4247), 0, y0 + 0.33, 0.123); for(const s of [-1, 1]) cyl(G, 0.008, 0.01, zink, s*0.18, y0 + 0.6, 0.126, 'z', 6);   // voorpaneel kolom
  box(G, 1.0, 0.07, 0.34, antr, 0, y0 + 0.675, -0.03);                                                                                   // dwarsdrager (kabelarmen)
  const kast = new THREE.Group(); kast.position.set(0, y0 + 0.73, 0); G.add(kast); const W = 0.66, H = 1.05, D = 0.39, zf = D/2;
  // achterbak (alu, donkerder), zijroosters met power unit (J)
  schil(kast, 0.6, H - 0.04, D - 0.04, aluD, 0, H/2, -0.02);
  const zr = perfo(128, 512, '#2a2d31', '#0b0c0d', 8);
  for(const s of [-1, 1]){ box(kast, 0.035, H - 0.1, D - 0.08, M(0x2f3337), s*(W/2 + 0.005), H/2, -0.03);
    plak(kast, D - 0.1, H - 0.14, zr, s*(W/2 + 0.024), H/2, -0.03, s*Math.PI/2); for(const yy of [0.05, H - 0.05]) box(kast, 0.04, 0.02, D - 0.08, antr, s*(W/2 + 0.006), yy, -0.03); }
  // zijkant rechts: noodstop (I) met beschermkap, meter-venster (H)
  { const xs = W/2 + 0.03, yN = 0.62; cyl(kast, 0.035, 0.012, geel, xs, yN, 0.1, 'x', 24); cyl(kast, 0.022, 0.03, rood, xs + 0.018, yN, 0.1, 'x', 20); cyl(kast, 0.026, 0.008, rood, xs + 0.034, yN, 0.1, 'x', 20);
    const kap = new THREE.Mesh(new THREE.SphereGeometry(0.04, 16, 8, 0, Math.PI*2, 0, Math.PI/2), M(0xdfe6ea, {transparent: true, opacity: 0.35, roughness: 0.1})); kap.rotation.z = -Math.PI/2; kap.position.set(xs + 0.005, yN, 0.1); kast.add(kap);

  plak(G, 0.06, 0.015, lbl('SUNGROW', 160, 40, '#0e1013', '#e3e6e8', 'bold 26px Arial'), 0, y0 + 1.33, 0.216);
  rbox(G, 0.06, 0.09, 0.012, 0.01, M(0x2b2d30), -0.06, y0 + 1.07, 0.218); box(G, 0.045, 0.06, 0.003, M(0x1a2733), -0.06, y0 + 1.08, 0.225);
  cyl(G, 0.03, 0.006, M(0x0e1013), 0.06, y0 + 1.07, 0.218, 'z', 28); const ring = new THREE.Mesh(new THREE.TorusGeometry(0.026, 0.003, 6, 28), blauwLed); ring.position.set(0.06, y0 + 1.07, 0.222); G.add(ring);
  // holsters aan de zijkanten (wit hoesje met blauwe ring) + noodstop
  for(const s of [-1, 1]){ rbox(G, 0.07, 0.17, 0.12, 0.02, wit, s*0.215, y0 + 1.1, 0.1); const hr = new THREE.Mesh(new THREE.TorusGeometry(0.045, 0.006, 8, 24), blauwLed); hr.position.set(s*0.215, y0 + 1.1, 0.165); G.add(hr); }
  cyl(G, 0.025, 0.02, rood, 0.17, y0 + 1.42, 0.2, 'z', 18); cyl(G, 0.035, 0.006, geel, 0.17, y0 + 1.42, 0.198, 'z', 20);
  // vloeistofgekoelde CCS2-kabels: van de arm in een lus omlaag naar de stekker in het holster
  for(const s of [-1, 1]){ const st = ccs2(G, s*0.215, y0 + 1.16, 0.2, -0.15);
    kabel(G, [V(s*0.37, y0 + 1.58, 0.03), V(s*0.42, y0 + 1.2, 0.12), V(s*0.45, y0 + 0.4, 0.3), V(s*0.38, y0 + 0.08, 0.42), V(s*0.3, y0 + 0.5, 0.36), V(s*0.24, y0 + 1.0, 0.28), V(s*0.215, y0 + 1.37, 0.2)], 0.022, M(0x1b1c1e, {roughness: 0.45})); }
  sprite('dispenser #' + nr + ' · 2 × CCS2 (500 A)', V(x, 2.85, z), 0.42);
  return G; }

function auto(x, z, ry){ const G = new THREE.Group(); G.position.set(x, 0, z); G.rotation.y = ry || 0; scene.add(G); AUTOS.push(G);
  const k = [0x3a6ea5, 0xb8bcc0, 0x8a2b2b, 0x2d3237][AUTOS.length % 4];
  box(G, 1.85, 0.62, 4.6, M(k, {roughness: 0.3, metalness: 0.5}), 0, 0.55, 0); box(G, 1.62, 0.46, 2.3, glas, 0, 1.08, 0.2); box(G, 1.5, 0.05, 2.0, M(k, {roughness: 0.3, metalness: 0.5}), 0, 1.33, 0.25);
  for(const [a, b] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) cyl(G, 0.33, 0.22, zwart, a*0.86, 0.33, b*1.45, 'x', 18);
  return G; }

// vrije ruimte (zone op de grond) en maatlijnen
function zone(x0, z0, x1, z1, txt){ const g = new THREE.Mesh(new THREE.PlaneGeometry(x1 - x0, z1 - z0), new THREE.MeshBasicMaterial({color: 0x3fa34d, transparent: true, opacity: 0.22, depthWrite: false}));
  g.rotation.x = -Math.PI/2; g.position.set((x0 + x1)/2, 0.012, (z0 + z1)/2); scene.add(g); ZONE.push(g);
  const l = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(x1 - x0, 0.001, z1 - z0)), new THREE.LineDashedMaterial({color: 0x1f8a4c, dashSize: 0.15, gapSize: 0.1}));
  l.computeLineDistances(); l.position.copy(g.position); scene.add(l); ZONE.push(l); if(txt) sprite(txt, V((x0 + x1)/2, 0.3, z1 + 0.15), 0.3, '#1f8a4c', ZONE); }

  for(const [p, q] of [[a, a2], [b, b2], [a2, b2]]){ const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints([p, q]), mL); l.renderOrder = 9; g.add(l); }
  scene.add(g); MAAT.push(g); const sp = sprite(txt, a2.clone().lerp(b2, 0.5).add(V(0, 0.18, 0)), 0.3, '#1a4f9c', MAAT); g.visible = false; sp.visible = false; }

// ---------- opstelling ----------
const KAST = {x: -6, z: -3};                                                       // verdeelkast / aansluitpunt (netzijde)

{ const vk = new THREE.Group(); vk.position.set(KAST.x, 0, KAST.z); scene.add(vk); box(vk, 1.2, 0.2, 0.6, beton, 0, 0.1, 0); box(vk, 1.0, 1.5, 0.45, M(0x9aa3a8, {metalness: 0.4}), 0, 0.95, 0);
  plak(vk, 0.5, 0.2, lbl('VERDEELKAST', 260, 90, '#f2c400', '#111', 'bold 30px Arial'), 0, 1.5, 0.226);
  sprite(PROD === 'idc' ? 'verdeelkast / HVK (netzijde)' : 'trafo / HVK (netzijde)', V(KAST.x, 2.1, KAST.z), 0.4); }

const kab = (pts, r) => { const o = kabel(scene, pts, r || 0.03, kabelM); KABEL.push(o); return o; };
if(PROD === 'idc'){
  const P = 2.66;                                                                    // h.o.h.: 0,66 kast + 2,0 m vrij (Sungrow 3.1.2)

    // auto's links en rechts van elke lader (2 laadpunten per lader)

    zone(x - 0.33 - (i === 0 ? 1.5 : 1.0), -0.2 - 0.2, x + 0.33 + (i === N - 1 ? 1.5 : 1.0), 0.2 + 1.2, i === 0 ? 'vrije ruimte Sungrow: zijkant 1500 · tussen laders 2000 · voor 800–1200' : null);
    kab([V(KAST.x + 0.2, 0.1, KAST.z), V(KAST.x + 0.2, -0.6, KAST.z + 0.3), V(KAST.x + 0.6, -0.6, -1.2 - i*0.12), V(x, -0.6, -1.2 - i*0.12), V(x, -0.6, -0.1), V(x, 0.3, -0.05), V(x, 0.95, -0.05)], 0.022);
    maat(V(x - 0.33, 0.93, 0.25), V(x + 0.33, 0.93, 0.25), V(0, 0, 0.6), '660');
  }
  for(let k = 0; k <= N; k++) auto(x0 - P/2 + k*P, 3.6, 0);                       // 1 parkeervak tussen/naast elke lader: elke lader bedient 2 vakken
  maat(V(x0 - 0.42, 0.2, 0.363), V(x0 + 0.42, 0.2, 0.363), V(0, 0, 0.9), 'fundering 840 × 726');
  maat(V(x0 + 0.42, 0, -0.363), V(x0 + 0.42, 1.98, -0.363), V(0.5, 0, 0), 'h 1780 (+200 fundering)');
  if(N > 1) maat(V(x0 + 0.33, 0.6, 0.6), V(x0 + P - 0.33, 0.6, 0.6), V(0, 0, 0.2), '2000 vrij');
  FOCUS = V(0, 1, 1);
  INFO = {Product: 'Sungrow IDC80E (alles-in-één)', Vermogen: N + ' × 80 kW = ' + N*80 + ' kW', Laadpunten: N*2 + ' × CCS2 (2 × 40 kW gelijktijdig)', 'AC per lader': '3/N/PE 400 V · 125 A', 'AC totaal': N + ' × 125 A = ' + N*125 + ' A', 'Kabel per lader': '4×50 + 25 Cu (handleiding) · max 95 mm² (sheet)', Afmeting: '660 × 1050 × 390 (op voet 1780 h)'};
} else {
  const cx = 0, cz = -2.2; cdcKast(cx, cz);
  zone(cx - 0.8 - 0.5, cz - 0.563 - 1.0, cx + 0.8 + 0.5, cz + 0.563 + 1.0, 'vrije ruimte: voor/achter ≥ 1000 · zijkant ≥ 500');
  kab([V(KAST.x + 0.2, 0.1, KAST.z), V(KAST.x + 0.2, -0.7, KAST.z + 0.2), V(cx - 0.4, -0.7, cz - 0.1), V(cx - 0.4, 0.4, cz + 0.2)], 0.045);
  kab([V(KAST.x + 0.35, 0.1, KAST.z), V(KAST.x + 0.35, -0.75, KAST.z + 0.2), V(cx + 0.4, -0.75, cz - 0.3), V(cx + 0.4, 0.4, cz + 0.2)], 0.045);
  const P = 5.4, x0 = -(N - 1)*P/2, dz = 3.2;
  asf(x0 - 2.5, dz - 1.0, x0 + (N - 1)*P + 2.5, dz + 6.0);
  for(let i = 0; i < N; i++){ const x = x0 + i*P; dispenser(x, dz, i + 1); auto(x - 1.3, dz + 3.3, 0); auto(x + 1.3, dz + 3.3, 0);
    kab([V(cx + 0.1*(i - N/2), 0.3, cz + 0.2), V(cx + 0.1*(i - N/2), -0.6, cz + 0.6), V(x, -0.6, dz - 1.2), V(x, -0.6, dz - 0.1), V(x, 0.4, dz)], 0.03); }
  maat(V(cx - 0.8, 2.3, cz + 0.563), V(cx + 0.8, 2.3, cz + 0.563), V(0, 0.4, 0), '1600');
  maat(V(cx + 0.8, 0.2, cz - 0.563), V(cx + 0.8, 0.2, cz + 0.563), V(0.6, 0, 0), '1126');

  maat(V(x0 - 0.35, 2.4, dz + 0.425), V(x0 + 0.35, 2.4, dz + 0.425), V(0, 0.3, 0), '703 × 850 × 2204');
  FOCUS = V(0, 1, 1.5);
  INFO = {Product: 'Sungrow CDC1000E ChargeStack', Vermogen: '1000 kW (2 × 500 kW), max. 12 uitgangen', Dispensers: N + ' × CCS (2 × CCS2, 500 A / boost 800 A)', 'AC-aansluiting': '2 circuits × (3 × 185 Cu + N 185 + PE 95)', 'AC-stroom': '≈ 2 × 760 A (1 MW / 400 V / 0,97)', Afmeting: 'cabinet 1600 × 2200 × 1126 · ≤ 1600 kg'};
}
sprite('kabels in de grond (600 mm)', V(KAST.x + 1.5, 0.35, KAST.z + 0.6), 0.3, '#5d6b73', KABEL);

// ---------- paneel ----------
const $ = id => document.getElementById(id);
$('cfgNkop').textContent = PROD === 'idc' ? "Aantal laders" : 'Aantal dispensers';
for(let n = 1; n <= (PROD === 'cdc' ? 6 : 4); n++){ const b = document.createElement('button'); b.textContent = n; if(n === N) b.classList.add('aan'); b.onclick = () => { if(n !== N) location.search = '?n=' + n; }; $('cfgN').appendChild(b); }
$('cfgInfo').innerHTML = '<table class="info">' + Object.entries(INFO).map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('') + '</table>';
$('pDicht').onclick = () => { $('paneel').classList.toggle('dicht'); $('pDicht').textContent = $('paneel').classList.contains('dicht') ? '‹' : '›'; };
const reset = () => { location.search = '?n=' + N; }; $('pReset').onclick = reset;
const zet = (lijst, v) => lijst.forEach(o => o.visible = v);
$('tZone').onchange = e => zet(ZONE, e.target.checked); $('tMaat').onchange = e => zet(MAAT, e.target.checked); $('tKabel').onchange = e => zet(KABEL, e.target.checked);
$('tAuto').onchange = e => zet(AUTOS, e.target.checked); $('tLabel').onchange = e => zet(LABELS, e.target.checked);
$('tGrond').onchange = e => GRONDM.forEach(m => { m.transparent = e.target.checked; m.opacity = e.target.checked ? 0.35 : 1; m.depthWrite = !e.target.checked; m.needsUpdate = true; });
let deurDoel = 0; $('tDeur').onchange = e => deurDoel = e.target.checked ? 1 : 0; let deurT = 0;
const VIEW = (t, th, ph, r) => () => { ctl.target.copy(t); const p = V(Math.sin(ph)*Math.sin(th), Math.cos(ph), Math.sin(ph)*Math.cos(th)).multiplyScalar(r).add(t); camera.position.copy(p); };
const vOver = VIEW(FOCUS, -0.55, 0.95, PROD === 'idc' ? 9 + N*1.6 : 16 + N*2.4);
$('vOver').onclick = vOver; $('vBoven').onclick = VIEW(FOCUS, 0, 0.02, PROD === 'idc' ? 10 + N*2.2 : 20 + N*1.5);
$('vUnit').onclick = PROD === 'idc' ? VIEW(V(-(N - 1)*1.33, 1.4, 0), 0.35, 1.3, 3.6) : VIEW(V(0, 1.3, -2.2), 0.4, 1.25, 6);
$('vKabel').onclick = () => { $('tDeur').checked = true; deurDoel = 1; (PROD === 'idc' ? VIEW(V(-(N - 1)*1.33, 1.0, 0), 0.2, 1.35, 2.2) : VIEW(V(0, 0.7, -2.2), 0.15, 1.3, 3.6))(); };
vOver();
window.addEventListener('keydown', e => { if(e.key === 'r' || e.key === 'R') reset(); });
// ---------- risico's / aandachtspunten ----------
const FILTER = a => !(['Kabelaansluiting CDC1000E']).includes(a);
const RIS = [
  ['r3', 'Kabelaansluiting CDC1000E', 'Per 500 kW-circuit staan klemmen voor <b>1 × 185 mm² Cu (of 300 Al) per fase</b>, en per kast 2 circuits. Bij 500 kW is de AC-stroom ≈ 760 A per circuit — dat kan niet met één 185 mm²-kabel per fase. Uit de tekening (L1 L2 L3 · N PE N · L1 L2 L3) lijken er 2 aansluitsets per circuit te zijn = <b>2 × 185 per fase</b> (≈ 380 A per kabel). In de grond bij Sww 1,5 en groepering haalt 185 Cu dat niet; <b>vraag Sungrow om max. aantal en doorsnede per fase en klemtype</b> (bijv. 2 × 240 / 4 × 185 per fase).'],
  ['r3', 'Kortsluitvastheid onbekend', 'Geen Icc / Icw / voorwaardelijke kortsluitstroom in sheets of handleidingen. Bij een HVK met 25–30 kA moet de interne MCCB / zekering dat aankunnen (NEN 1010 § 434.5). <b>Opvragen bij Sungrow.</b>'],
  ['r3', 'Aardlekbeveiliging (NEN 1010 § 722.531.3)', 'Handleiding: "3P MCCB zonder aardlek of 3P+N MCCB met aardlek" (vertaling onduidelijk). NEN 1010 eist per aansluitpunt aardlek (type B of A + 6 mA DC-detectie), tenzij elektrische scheiding. De IDC80E heeft een IMD (IT aan DC-zijde) → <b>verklaring van Sungrow dat de DC-uitgang galvanisch gescheiden is</b>, anders is een type-B RCD per lader nodig.'],
  ['r2', 'Kabeldoorsnede IDC80E', 'Handleiding: 4 × 50 + PE 25 mm² Cu (vaste kabelschoen SC50-8, M8). Sheet: "max. 95 mm²". Bij 125 A en lengtes > ± 60 m of in de grond met groepering wil je 70–95 mm². <b>Bevestigen dat 95 mm² (SC95-8) op de busbars en door de bodeminvoer past</b>; maximale kabeldiameter / wartel wordt nergens genoemd (open bodeminvoer met brandwerende kit).'],
  ['r2', 'Netbeheerder / netcode', 'THDi < 5 % alleen "bij vol vermogen" — bij deellast kan het hoger zijn. CDC1000E: cos φ 0,9 cap – 0,9 ind en "reactive power regulation" → afstemmen met netbeheerder (Q-regeling, blindvermogen, flicker, EN 61000-3-12). Certificaten CDC1000E alleen <b>CE / CB</b> (geen KEMA/DEKRA/TÜV-rapport genoemd).'],
  ['r2', 'AFIR (EU 2023/1804)', 'Publieke laders ≥ 50 kW moeten een <b>betaalautomaat (pinpas / creditcard)</b> hebben — bij beide producten "optioneel". OCPP 2.0.1 "coming soon / ready for". Meetcertificaat: IDC80E MID/Eichrecht, CDC-dispensers MID optioneel.'],
  ['r2', 'Nieuw product', 'IDC80E: "Available in June" (2026) → beperkte praktijkervaring, documentatie op onderdelen inconsistent (kabeltabel vs. sheet, vertaling upstream-beveiliging). Garantie 3 jaar standaard.'],
  ['r1', 'Stelsel / spanning', 'TN-C, TN-S, TN-C-S en TT toegestaan · 400 V (323–440 V) · 50 Hz → past op het Nederlandse net.'],
  ['r1', 'Omgeving', 'IDC80E IP65, C5, IK10, −30…60 °C (derating > 50 °C). CDC1000E IP55, −35…55 °C. Hoogte ≤ 2000 m. Geluid ≤ 60/65 dB(A) op 1 m — toetsen aan Activiteitenbesluit bij woningen.'],
  ['r1', 'Ruimte & fundering', 'IDC80E: 1500 zijkant, 2000 tussen laders, 800–1200 voor, fundering 840 × 726 × 600 (200 boven mv). CDC1000E: voor/achter ≥ 1000, zijkant ≥ 500, fundering 1800 × 1300, ≤ 1600 kg (heftruck ≥ 1,5 t).'],
  ['r2', 'Cyber / cloud', 'OTA-updates en beheer via Sungrow iEnergyCharge (4G/WiFi/Ethernet). Afstemmen met IT-beleid (externe toegang, NIS2) en of beheer via eigen CSMS (OCPP) zonder Sungrow-cloud kan.']];
$('kBody').innerHTML = '<p style="color:#5d6b73;margin:8px 0">Eerste screening op basis van productsheets en installatiehandleidingen (versie 2026). <span class="r3">●</span> blokkerend / opvragen · <span class="r2">●</span> aandacht · <span class="r1">●</span> akkoord</p><table><tr><th></th><th>Onderwerp</th><th>Bevinding / actie</th></tr>'
  + RIS.filter(([k, a]) => FILTER(a)).map(([k, a, b]) => `<tr><td class="${k}">●</td><td style="white-space:nowrap;font-weight:600">${a}</td><td>${b}</td></tr>`).join('') + '</table>';
$('bRisico').onclick = () => $('kaart').style.display = 'flex'; $('kX').onclick = () => $('kaart').style.display = 'none'; $('kaart').onclick = e => { if(e.target === $('kaart')) $('kaart').style.display = 'none'; };
// ---------- render ----------
function maatvoer(){ const w = innerWidth, h = innerHeight; renderer.setSize(w, h); camera.aspect = w/h; camera.updateProjectionMatrix(); }
addEventListener('resize', maatvoer); maatvoer();
(function loop(){ requestAnimationFrame(loop); deurT += (deurDoel - deurT)*0.12; DEUREN.forEach(d => d.piv.rotation.y = d.open*deurT); ctl.update(); renderer.render(scene, camera); })();
window.__sg = {scene, camera, ctl, VIEW};
</script>
